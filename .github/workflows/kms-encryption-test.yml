name: KMS Encryption Integration Tests

on:
  push:
    branches:
      - main
      - feat/kms
    paths-ignore:
      - '**/*.md'
      - '**/*.jpg'
      - '**/README.txt'
      - '**/LICENSE.txt'
      - 'docs/**'
      - 'ISSUE_TEMPLATE/**'
      - '**/remove-old-artifacts.yml'
  workflow_dispatch:

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  run-kms-encryption-tests:
    name: Run KMS Encryption Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dbEngine: ["mysql", "pg"]
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@v4
      - name: "Set up JDK 8"
        uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: 8
      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.407'
      - name: Configure AWS Credentials
        id: creds
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: dotnet_kms_encryption_test
          role-duration-seconds: 21600
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          output-credentials: true

      # The master key is cached behind a stable alias and reused across runs, so a run does not pay for
      # key creation and rows written by an earlier run stay readable.
      - name: Find or create the KMS master key
        id: kms-key
        run: |
          KEY_ID=$(aws kms list-aliases \
            --query "Aliases[?AliasName=='alias/dotnet-encryption-key'].TargetKeyId" \
            --output text 2>/dev/null || echo "")

          if [ -n "$KEY_ID" ]; then
            KEY_STATE=$(aws kms describe-key --key-id "$KEY_ID" \
              --query 'KeyMetadata.KeyState' --output text 2>/dev/null || echo "")
            if [ "$KEY_STATE" != "Enabled" ]; then
              echo "Cached key $KEY_ID is '$KEY_STATE' rather than Enabled, so a new one is needed."
              KEY_ID=""
            fi
          fi

          if [ -z "$KEY_ID" ]; then
            KEY_ID=$(aws kms create-key \
              --description ".NET Data Provider Wrapper encryption test key (cached)" \
              --key-usage ENCRYPT_DECRYPT \
              --key-spec SYMMETRIC_DEFAULT \
              --tags TagKey=Project,TagValue=aws-advanced-dotnet-data-provider-wrapper \
                     TagKey=Purpose,TagValue=testing \
              --query 'KeyMetadata.KeyId' \
              --output text)
            aws kms create-alias --alias-name "alias/dotnet-encryption-key" --target-key-id "$KEY_ID"
            aws kms enable-key-rotation --key-id "$KEY_ID"
            echo "Created KMS key $KEY_ID"
          fi

          # The tests read an ARN rather than a key id, so it is resolved here instead of assembled by hand.
          KEY_ARN=$(aws kms describe-key --key-id "$KEY_ID" --query 'KeyMetadata.Arn' --output text)
          echo "key_arn=$KEY_ARN" >> $GITHUB_OUTPUT
          echo "Using key $KEY_ARN"

      # Run before any cluster is created, so a missing kms:Decrypt grant fails in seconds rather than
      # after a cluster has come up.
      - name: Verify the key can encrypt and decrypt
        run: |
          DATA_KEY=$(aws kms generate-data-key \
            --key-id "${{ steps.kms-key.outputs.key_arn }}" \
            --key-spec AES_256 --output json)

          PLAINTEXT=$(echo "$DATA_KEY" | jq -r '.Plaintext')
          CIPHERTEXT=$(echo "$DATA_KEY" | jq -r '.CiphertextBlob')
          echo "::add-mask::$PLAINTEXT"
          echo "::add-mask::$CIPHERTEXT"

          DECRYPTED=$(aws kms decrypt \
            --ciphertext-blob fileb://<(echo "$CIPHERTEXT" | base64 -d) \
            --key-id "${{ steps.kms-key.outputs.key_arn }}" \
            --query 'Plaintext' --output text)
          echo "::add-mask::$DECRYPTED"

          if [ "$DECRYPTED" == "$PLAINTEXT" ]; then
            echo "Data key round trip succeeded."
          else
            echo "Data key round trip failed."
            exit 1
          fi

      - name: Run KMS Encryption Integration Tests
        timeout-minutes: 180
        run: |
          cd test/integration/host && ./gradlew --no-parallel --no-daemon test-all-${{ matrix.dbEngine }}-aurora-kms --info
        env:
          RDS_DB_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_KMS_KEY_ARN: ${{ steps.kms-key.outputs.key_arn }}
          AWS_ACCESS_KEY_ID: ${{ steps.creds.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.creds.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.creds.outputs.aws-session-token }}
          AWS_RDS_MONITORING_ROLE_ARN: ${{ secrets.AWS_RDS_MONITORING_ROLE_ARN }}
          MYSQL_VERSION: "default"
          PG_VERSION: "default"

      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report-kms-${{ matrix.dbEngine }}-aurora
          path: ./test/integration/container/reports
          retention-days: 5

      # The key is deliberately kept: the alias makes it reusable, and deleting it would make every row
      # an earlier run wrote unreadable.
      - name: Get Github Action IP
        if: always()
        id: ip
        run: echo "ipv4=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT
      - name: Remove Github Action IP
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress --group-name default --protocol all --port 0-65535 --cidr ${{ steps.ip.outputs.ipv4 }}/32

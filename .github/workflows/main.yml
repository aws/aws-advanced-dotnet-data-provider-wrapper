name: Build, Unit Test, and Linting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Both runtimes are needed: the test projects that cover the multitargeted libraries build for
      # net8.0 and net10.0, and executing the net8.0 test host requires the .NET 8 runtime. The 10.0
      # SDK still drives the build -- global.json pins 10.0 with rollForward latestFeature, which
      # cannot select an 8.0 SDK.
      - name: Setup .NET 8.0 and 10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # dotnet format, build and test see only the projects in the solution, so a project left out of
      # it is never checked. Benchmarks and the docs examples do not ship and are exempt.
      - name: Check every project is in the solution
        shell: pwsh
        run: |
          $sln = dotnet sln AwsWrapperDataProvider.sln list | Select-Object -Skip 2 |
                 ForEach-Object { $_.Trim().Replace('\', '/').ToLowerInvariant() }
          $missing = git ls-files '*.csproj' ':!docs/examples/' ':!AwsWrapperDataProvider.Benchmarks/' |
                     Where-Object { $sln -notcontains $_.ToLowerInvariant() }
          if ($missing) {
            $missing | ForEach-Object { Write-Host "::error::$_ is not in AwsWrapperDataProvider.sln, so CI never builds or tests it" }
            exit 1
          }

      - name: Run dotnet format
        run:  dotnet format AwsWrapperDataProvider.sln --verify-no-changes --verbosity diagnostic

      - name: Build
        run: dotnet build

      - name: Run unit tests
        # Exit code 8 is "zero tests ran". The integration-only test projects match nothing under
        # this filter, and Microsoft.Testing.Platform reports that as a failure where VSTest did not.
        run: dotnet test --filter Category!=Integration --no-build --ignore-exit-code 8
